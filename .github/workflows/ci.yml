name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: siktak_test
          POSTGRES_USER: siktak
          POSTGRES_PASSWORD: siktak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U siktak -d siktak_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # DB 통합 테스트(@Tag("db"))용. 로컬은 Neon dev 브랜치 값을 쓴다.
      TEST_DB_URL: jdbc:postgresql://localhost:5432/siktak_test
      TEST_DB_USERNAME: siktak
      TEST_DB_PASSWORD: siktak
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
      - run: ./gradlew test --no-daemon
      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-reports
          path: backend/build/reports/tests/test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
