spring:
  application:
    name: siktak-backend
  profiles:
    default: local
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Neon은 쓸 때만 깨운다(decisions.md): 놀고 있는 커넥션이 DB를 붙잡지 않게 한다.
      minimum-idle: 0
      idle-timeout: 60000
      keepalive-time: 0
      # DB 장애·재기동 시 요청이 기본 30초씩 묶이지 않게 한다.
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    # V1은 짝수·V2는 홀수 번호를 쓰므로 먼저 적용된 높은 번호 뒤에 낮은 번호가 들어올 수 있다 (CLAUDE.md 11장)
    out-of-order: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

siktak:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET:}
  payment:
    provider: mock
    mock:
      # true면 모의 결제 취소(환불)가 항상 실패한다 — 환불 실패·예외 처리함 시연용 (6.1)
      fail-cancel: ${SIKTAK_PAYMENT_MOCK_FAIL_CANCEL:false}
  # 정책 설정값 (docs/domain/states.md 9장)
  policy:
    # 자동 환불 재시도 횟수. 첫 시도가 실패하면 1분 간격으로 이만큼 다시 시도하고, 그래도 실패하면 REFUND_FAILED + 예외
    refund-retry-max: 3
    # 알림 발송 재시도 횟수. 첫 시도가 실패하면 1분 간격으로 이만큼 다시 시도하고, 그래도 실패하면 FAILED + 예외 (INF-08)
    notification-retry-max: 3
  notification:
    channel: in-app
    mock:
      # true면 앱 내 알림 발송이 항상 실패한다 — 재시도·예외 처리함 시연용 (5.2)
      fail: ${SIKTAK_NOTIFICATION_MOCK_FAIL:false}
  # 데모 도구: 데모 시계(offset)·시드 초기화·J1~J6 점프 (docs/demo-scenario.md). false면 offset 0 고정, 데모 API 404
  demo:
    enabled: ${SIKTAK_DEMO_ENABLED:true}
    # 빈 DB로 기동하면 demo-v1 시드를 자동 투입
    auto-seed: ${SIKTAK_DEMO_AUTO_SEED:true}
  # 시간 기반 작업 실행기: 틱은 메모리 일정만 본다 (DB 폴링 없음)
  scheduler:
    enabled: ${SIKTAK_SCHEDULER_ENABLED:true}
    tick: PT1M
  matching:
    # v2: 매칭 엔진(matching.domain.engine) / simple: 2.3 가짜 순차 매칭 (데모 직전 비상 전환용)
    engine: ${SIKTAK_MATCHING_ENGINE:v2}
