# DB 통합 테스트(@Tag("db")) 전용 프로필.
# CI: GitHub Actions Postgres 서비스 컨테이너 / 로컬: Neon dev 브랜치 (docs/decisions.md)
spring:
  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}

siktak:
  # 테스트는 필요한 데이터를 스스로 만들고, 실행기는 테스트가 직접 호출한다
  demo:
    auto-seed: false
  scheduler:
    enabled: false
