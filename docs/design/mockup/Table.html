<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>오늘의 테이블</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Playfair+Display:ital,wght@0,900;1,400;1,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a:hover{opacity:.88}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4EDE1; color: #1C1A17; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #7E2A27; color: #F8F1E6; padding: 8px 14px 14px">
    <div style="display: flex; align-items: center; gap: 6px">
      <a href="Main.html" aria-label="뒤로" style="display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; color: #F8F1E6">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
      </a>
      <div style="display: flex; flex-direction: column">
        <span style="font-family: 'Noto Serif KR', serif; font-size: 18px; font-weight: 900">오늘의 테이블</span>
        <span style="font-size: 11px; opacity: .8">10.24 FRI 19:30 · 성수 오크테이블</span>
      </div>
    </div>
    <div style="display: flex; gap: 10px; padding: 10px 6px 0">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #E4B04A; color: #1C1A17; border: 2px solid #F8F1E6; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">나</span><span style="font-size: 10px">여행가</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #9DB08A; color: #1C1A17; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">미</span><span style="font-size: 10px">미식가</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #8FB3C9; color: #1C1A17; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">영</span><span style="font-size: 10px">영화광</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #E07A5F; color: #1C1A17; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">산</span><span style="font-size: 10px">산책러</span></div>
      <div style="display: flex; flex-direction: column; align-items: center; gap: 4px"><span style="width: 40px; height: 40px; border-radius: 50%; background: #F8F1E6; color: #1C1A17; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700">책</span><span style="font-size: 10px">독서가</span></div>
    </div>
  </header>

  <div style="flex: 1; overflow: hidden; padding: 16px 16px 0; display: flex; flex-direction: column; gap: 14px">
    <article style="background: #FBF7F0; border: 1.5px solid #1C1A17; box-shadow: 4px 4px 0 #1C1A17; padding: 16px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-family: 'Playfair Display', serif; font-style: italic; font-size: 16px; color: #7E2A27">Editor's note</span>
        <span style="font-size: 10px; letter-spacing: 1.5px; color: #6B6258">성비 3:2 · 20대 후반</span>
      </div>
      <p style="margin: 8px 0 0; font-family: 'Noto Serif KR', serif; font-size: 16px; line-height: 1.6; font-weight: 700">"여행지에서 먹은 한 끼를 아직도 기억하는 사람들이 모였어요."</p>
    </article>

    <section>
      <div style="font-size: 10px; letter-spacing: 2px; color: #6B6258; margin-bottom: 8px">오늘의 대화 주제 · 19:30 공개</div>
      <div style="display: flex; gap: 8px">
        <div style="flex: 1; background: #E4B04A; padding: 12px 10px; min-height: 104px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Playfair Display', serif; font-weight: 900; font-size: 22px">01</span><span style="font-size: 12px; line-height: 1.45; font-weight: 500">기억에 남는 여행지의 한 끼</span></div>
        <div style="flex: 1; background: #9DB08A; padding: 12px 10px; min-height: 104px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Playfair Display', serif; font-weight: 900; font-size: 22px">02</span><span style="font-size: 12px; line-height: 1.45; font-weight: 500">아껴두는 동네 맛집</span></div>
        <div style="flex: 1; background: #8FB3C9; padding: 12px 10px; min-height: 104px; display: flex; flex-direction: column; gap: 6px"><span style="font-family: 'Playfair Display', serif; font-weight: 900; font-size: 22px">03</span><span style="font-size: 12px; line-height: 1.45; font-weight: 500">영화 속 한 장면</span></div>
      </div>
    </section>

    <div style="display: flex; flex-direction: column; gap: 8px">
      <div style="align-self: center; font-size: 11px; color: #6B6258">— 우연한 식탁 공지 · 예약명 우연한식탁-1024-1 —</div>
      <div style="display: flex; gap: 8px; align-items: flex-end">
        <span style="width: 28px; height: 28px; border-radius: 50%; background: #9DB08A; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none">미</span>
        <div style="max-width: 230px; background: #FBF7F0; border: 1.5px solid #1C1A17; padding: 9px 12px; font-size: 14px; line-height: 1.5">오크테이블 파스타 맛있대요! 기대돼요</div>
      </div>
      <div style="align-self: flex-end; max-width: 240px; background: #1C1A17; color: #F8F1E6; padding: 9px 12px; font-size: 14px; line-height: 1.5">저 10분 정도 늦어요, 먼저 주문해 주세요</div>
    </div>
  </div>

  <form style="display: flex; gap: 8px; padding: 12px 16px 20px; border-top: 1.5px solid #1C1A17; background: #FBF7F0" onsubmit="return false">
    <label for="msg" style="position: absolute; left: -9999px">메시지</label>
    <input id="msg" placeholder="메시지 보내기" style="flex: 1; height: 44px; border: 1.5px solid #1C1A17; background: #F4EDE1; padding: 0 12px; font-family: inherit; font-size: 14px; color: #1C1A17">
    <button type="submit" style="height: 44px; padding: 0 18px; background: #7E2A27; color: #F8F1E6; border: 0; font-family: inherit; font-size: 14px; font-weight: 700">보내기</button>
  </form>
</div>

</body>
</html>
