<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>매칭 실패 해결</title>

</head>
<body>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;700;900&amp;family=Noto+Sans+KR:wght@400;500;700&amp;family=Playfair+Display:ital,wght@0,900;1,400;1,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a:hover{opacity:.88}
</style>

<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F4EDE1; color: #1C1A17; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; overflow: hidden">
  <section style="background: #E4B04A; position: relative; height: 330px; overflow: hidden">
    <header style="display: flex; justify-content: space-between; align-items: baseline; padding: 16px 22px 0">
      <span style="font-family: 'Noto Serif KR', serif; font-size: 20px; font-weight: 900; letter-spacing: -.5px">우연한 식탁</span>
      <span style="font-size: 10px; letter-spacing: 2px">No.12 · AUTUMN</span>
    </header>
    <div style="padding: 20px 22px 0; position: relative; z-index: 2">
      <div style="font-family: 'Playfair Display', serif; font-style: italic; font-size: 17px">Saving your seat.</div>
      <h1 style="margin: 6px 0 0; font-family: 'Noto Serif KR', serif; font-size: 29px; line-height: 1.3; font-weight: 900; letter-spacing: -1.2px">이번엔 꼭 맞는<br>자리를 찾지 못했어요</h1>
    </div>
    <svg viewBox="0 0 390 170" width="390" height="170" style="position: absolute; left: 0; bottom: 0" aria-hidden="true">
      <ellipse cx="195" cy="150" rx="150" ry="58" fill="#B9875A"></ellipse>
      <ellipse cx="195" cy="150" rx="150" ry="58" fill="none" stroke="#9C6E46" stroke-width="2"></ellipse>
      <ellipse cx="195" cy="132" rx="34" ry="13" fill="#F8F1E6"></ellipse>
      <ellipse cx="195" cy="132" rx="22" ry="8" fill="none" stroke="#D8CDBE" stroke-width="2"></ellipse>
      <rect x="244" y="96" width="14" height="32" rx="3" fill="#F8F1E6" opacity=".85"></rect>
      <circle cx="300" cy="60" r="26" fill="#F8F1E6" stroke="#1C1A17" stroke-width="2"></circle>
      <path d="M300 44 V60 L311 67" stroke="#1C1A17" stroke-width="2.5" fill="none" stroke-linecap="round"></path>
    </svg>
  </section>

  <p style="margin: 0; padding: 18px 22px 0; font-size: 13px; line-height: 1.7; color: #4A443D">10월 25일 성수 일정에 조건 맞는 분이 부족했어요. <b style="color: #1C1A17">결제는 그대로</b>, 추가 비용 없이 옮길 수 있어요.</p>

  <section style="padding: 14px 18px 0; display: flex; flex-direction: column; gap: 10px">
    <a href="#" style="display: flex; text-decoration: none; color: #1C1A17; background: #FBF7F0; border: 1.5px solid #1C1A17; box-shadow: 4px 4px 0 #1C1A17">
      <div style="width: 76px; background: #7E2A27; color: #F8F1E6; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0">
        <span style="font-family: 'Playfair Display', serif; font-weight: 900; font-size: 30px; line-height: 1">31</span>
        <span style="font-size: 10px; letter-spacing: 1.5px">OCT FRI</span>
      </div>
      <div style="flex: 1; padding: 12px 14px; border-left: 1.5px dashed #1C1A17; display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 3px">
          <span style="font-family: 'Noto Serif KR', serif; font-size: 16px; font-weight: 900">19:30 · 성수</span>
          <span style="font-size: 11px; color: #6B6258">선택하신 지역</span>
        </div>
        <span style="font-size: 11px; font-weight: 700; background: #9DB08A; padding: 3px 8px">추천</span>
      </div>
    </a>
    <a href="#" style="display: flex; text-decoration: none; color: #1C1A17; background: #FBF7F0; border: 1.5px solid #1C1A17">
      <div style="width: 76px; background: #1C1A17; color: #F8F1E6; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 0">
        <span style="font-family: 'Playfair Display', serif; font-weight: 900; font-size: 30px; line-height: 1">31</span>
        <span style="font-size: 10px; letter-spacing: 1.5px">OCT FRI</span>
      </div>
      <div style="flex: 1; padding: 12px 14px; border-left: 1.5px dashed #1C1A17; display: flex; justify-content: space-between; align-items: center">
        <div style="display: flex; flex-direction: column; gap: 3px">
          <span style="font-family: 'Noto Serif KR', serif; font-size: 16px; font-weight: 900">19:30 · 강남</span>
          <span style="font-size: 11px; color: #6B6258">다른 지역</span>
        </div>
        <span style="font-size: 13px; font-weight: 700; color: #7E2A27">이동 →</span>
      </div>
    </a>
  </section>

  <div style="flex: 1"></div>

  <section style="padding: 0 18px 8px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
    <button type="button" style="height: 52px; background: #FBF7F0; border: 1.5px solid #1C1A17; color: #1C1A17; font-family: inherit; font-size: 14px; font-weight: 700">이용권 보관</button>
    <button type="button" style="height: 52px; background: #1C1A17; border: 0; color: #F8F1E6; font-family: inherit; font-size: 14px; font-weight: 700">바로 환불</button>
  </section>
  <p style="margin: 0; padding: 0 22px 20px; font-size: 11px; color: #6B6258; text-align: center">10월 25일까지 선택하지 않으면 이용권으로 보관돼요</p>
</div>

</body>
</html>
